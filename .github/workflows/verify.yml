name: Verify app and rules

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Regenerate current Necron rules graph
        run: npm run build:data
      - name: Validate offline rules packages
        run: npm run validate:data
      - name: Reject stale generated rules packages
        shell: bash
        run: |
          # source.json carries a generated timestamp, and version.json therefore has a timestamp-driven source hash.
          # Gate every substantive package while validate:data still verifies the regenerated manifest/hash graph.
          git diff --exit-code -- public/data \
            ':(exclude)public/data/version.json' \
            ':(exclude)public/data/necrons/source.json'
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Production build
        run: npm run build

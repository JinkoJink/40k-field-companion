name: Sync Necron 11e data

on:
  push:
    branches:
      - main
      - data/necrons-11e-three-source
    paths:
      - 'scripts/build-necron-data.mjs'
      - 'scripts/validate-packages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-necron-11e-data.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-necron-data.mjs'
      - 'scripts/validate-packages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-necron-11e-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: necron-11e-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[data-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build Necron-only 11e dataset
        run: npm run build:data
      - name: Validate scope and package integrity
        run: npm run validate:data
      - name: Commit generated offline packages
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo 'Data is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m 'chore(data): refresh Necron 11e packages [data-sync]'
          git push

name: Sync Supabase rules

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: supabase-rules-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Mirror canonical rules from Supabase
        run: node scripts/sync-supabase-rules.mjs

      - name: Commit changed rules snapshots
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "Supabase and GitHub rules are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data
          git commit -m "Mirror published rules from Supabase"
          git push

name: Build and publish Android installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate frozen Necron dataset
        run: npm run validate:data

      - name: Check service worker syntax
        run: node --check public/sw.js

      - name: Build web app from checked-in source and frozen data
        run: npm run build

      - name: Verify Vite output contains frozen rules data
        run: |
          test -f dist/data/version.json
          test -f dist/data/necrons/units.json
          test -f dist/data/necrons/core-rules.json
          test -f dist/data/necrons/community-40kdc.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/data/version.json','utf8')); if(m.schemaVersion!==2||m.scope?.factions?.join(',')!=='necrons') process.exit(1); console.log('dist contains Necron schema v2 data');"

      - name: Sync exact web bundle into Android assets
        run: npx cap sync android

      - name: Verify Android assets contain exact web build
        run: |
          test -f android/app/src/main/assets/public/data/version.json
          test -f android/app/src/main/assets/public/data/necrons/units.json
          test -f android/app/src/main/assets/public/data/necrons/core-rules.json
          test -f android/app/src/main/assets/public/data/necrons/community-40kdc.json
          printf '%s\n' "${GITHUB_SHA}" > android/app/src/main/assets/public/build-commit.txt

      - name: Install stable debug signing key
        env:
          COMMAND_PROTOCOLS_DEBUG_KEYSTORE_B64: 
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$COMMAND_PROTOCOLS_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build APK
        env:
          COMMAND_PROTOCOLS_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK contains this exact commit and bundled data
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/public/data/version.json'
          unzip -l "$APK" | grep -q 'assets/public/data/necrons/units.json'
          unzip -l "$APK" | grep -q 'assets/public/build-commit.txt'
          unzip -p "$APK" assets/public/build-commit.txt | grep -Fxq "$GITHUB_SHA"
          echo "Verified APK is built from ${GITHUB_SHA}"

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="android-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          NAME="Command Protocols Android ${GITHUB_RUN_NUMBER} (${SHORT_SHA})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk Command-Protocols.apk
          sha256sum Command-Protocols.apk > Command-Protocols.apk.sha256

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" \
            Command-Protocols.apk \
            Command-Protocols.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "Built and verified from commit $GITHUB_SHA. Frozen bundled Necron rules data. Automatic rules publishing remains quarantined." \
            --latest

      - name: Verify published release points to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json targetCommitish,assets,url > release.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('release.json')); if(r.targetCommitish!==process.env.GITHUB_SHA) throw new Error('Release target does not match build commit'); if(!r.assets.some(a=>a.name==='Command-Protocols.apk')) throw new Error('APK missing from release'); console.log(r.url);"
